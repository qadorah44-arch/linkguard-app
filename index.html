<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LinkGuard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d4f6c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef2f5;--ink:#10202b;--mute:#566673;--card:#fff;--line:#d3dce3;--safe:#1d8a5b;--warn:#a87400;--bad:#c8372d;--accent:#0d4f6c;--btn:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a22;--ink:#e8f0f5;--mute:#93a6b3;--card:#15262f;--line:#27404d;--safe:#3cc48a;--warn:#e8b030;--bad:#ff6a5e;--accent:#5cc0e8;--btn:#08202b}}
:root[data-theme="dark"]{--bg:#0e1a22;--ink:#e8f0f5;--mute:#93a6b3;--card:#15262f;--line:#27404d;--safe:#3cc48a;--warn:#e8b030;--bad:#ff6a5e;--accent:#5cc0e8;--btn:#08202b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:28px 18px 48px}
h1{font:700 2rem/1.1 Georgia,serif;margin:0 0 6px}
p.lead{color:var(--mute);margin:0 0 22px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 240px;min-width:0;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,button:focus-visible,.samples button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#go{padding:13px 22px;border:0;border-radius:10px;background:var(--accent);color:var(--btn);font:700 1rem "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
.samples{margin:14px 0 0;color:var(--mute);font-size:.92rem}
.samples button{background:none;border:0;padding:6px 4px;margin-right:8px;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
#out{margin-top:26px;display:none}
.meter{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--safe) 0 20%,var(--warn) 20% 50%,var(--bad) 50% 100%);position:relative}
.pin{position:absolute;top:-6px;width:6px;height:28px;border-radius:3px;background:var(--ink);transition:left .5s ease;left:0}
.verdict{font:700 1.6rem Georgia,serif;margin:18px 0 2px}
.safe{color:var(--safe)}.suspicious{color:var(--warn)}.danger{color:var(--bad)}
ul{padding-left:20px;margin:10px 0 0}li{margin:6px 0}
.dom{color:var(--mute);margin:0}
.note{margin-top:30px;color:var(--mute);font-size:.85rem}
@media(prefers-reduced-motion:reduce){.pin{transition:none}}
</style></head><body><main>
<h1>LinkGuard</h1>
<p class="lead">Paste a link before you tap it. We check it for phishing and scam signs.</p>
<div class="row">
<input id="u" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://example.com/..." aria-label="Link to check">
<button id="go">Check link</button></div>
<div class="samples">Try:
<button data-u="https://www.google.com/search?q=hello">safe link</button>
<button data-u="http://paypa1-secure-login.xyz/verify/account">fake PayPal</button>
<button data-u="http://192.168.4.7/sbi-kyc-update">IP address</button></div>
<section id="out" aria-live="polite">
<div class="meter"><div class="pin" id="pin"></div></div>
<div class="verdict" id="v"></div>
<p class="dom" id="d"></p>
<ul id="r"></ul></section>
<p class="note">Checked on this device; your link is never sent anywhere. This is a risk estimate, not a guarantee. It can’t see the page itself, so stay careful with unknown senders.</p>
</main>
<script>
const BRANDS=["google","paypal","amazon","apple","microsoft","facebook","instagram","whatsapp","netflix","youtube","linkedin","telegram","flipkart","phonepe","paytm","gpay","airtel","jio","sbi","onlinesbi","hdfc","hdfcbank","icici","icicibank","axis","axisbank","kotak","pnb","irctc","uidai","aadhaar","epfo","incometax","fedex","dhl","dtdc","binance","coinbase"];
const OFFICIAL={google:["google.com","google.co.in","goo.gl","gmail.com","googleapis.com","gstatic.com","googleusercontent.com","youtube.com"],youtube:["youtube.com","youtu.be"],gpay:["google.com"],sbi:["sbi.co.in","onlinesbi.sbi","sbi.com","onlinesbi.com"],onlinesbi:["onlinesbi.sbi","onlinesbi.com"],whatsapp:["whatsapp.com","whatsapp.net","wa.me"],facebook:["facebook.com","fb.com","fb.me"],instagram:["instagram.com","cdninstagram.com"],apple:["apple.com","icloud.com"],microsoft:["microsoft.com","live.com","office.com","outlook.com","microsoftonline.com"],amazon:["amazon.com","amazon.in","amazon.co.uk","amazon.de","amazonaws.com"],hdfc:["hdfcbank.com","hdfc.com"],hdfcbank:["hdfcbank.com"],icici:["icicibank.com","icici.com"],icicibank:["icicibank.com"],axis:["axisbank.com"],axisbank:["axisbank.com"],kotak:["kotak.com"],pnb:["pnbindia.in"],telegram:["telegram.org","t.me"],linkedin:["linkedin.com","lnkd.in"],netflix:["netflix.com","nflxvideo.net"],paytm:["paytm.com"],phonepe:["phonepe.com"],irctc:["irctc.co.in"],uidai:["uidai.gov.in"],aadhaar:["uidai.gov.in"],epfo:["epfindia.gov.in","epfo.gov.in"],incometax:["incometax.gov.in","incometaxindia.gov.in"],airtel:["airtel.in","airtel.com"],jio:["jio.com"]};
const officialFor=b=>OFFICIAL[b]||[b+".com",b+".in",b+".co.in"];
const isOfficial=r=>BRANDS.some(b=>officialFor(b).includes(r));
const RISKY=["zip","xyz","top","tk","click","gq","ml","cf","work","rest","country","icu","buzz","cyou","monster","cam","loan","bid","win"];
const SHORT=["bit.ly","tinyurl.com","t.co","goo.gl","is.gd","cutt.ly","rb.gy","shorturl.at","ow.ly","buff.ly","tiny.cc","s.id","v.gd","lnkd.in","rebrand.ly","t.ly","bl.ink","adf.ly","shorte.st"];
const FREEHOST=["github.io","netlify.app","pages.dev","workers.dev","vercel.app","web.app","firebaseapp.com","glitch.me","herokuapp.com","ngrok.io","ngrok-free.app","trycloudflare.com","blogspot.com","weebly.com","wixsite.com","000webhostapp.com","notion.site","carrd.co","linktr.ee","forms.gle","docs.google.com","sites.google.com","drive.google.com"];
const WORDS=["login","signin","verify","secure","account","update","bank","free","gift","prize","password","wallet","confirm","otp","kyc","claim","reward","lottery","winner","refund","suspend","blocked","urgent","recharge","cashback","aadhaar","aadhar","unlock","helpdesk","customer-care"];
const BADFILE=/\.(apk|xapk|exe|msi|scr|bat|cmd|jar|vbs|ps1)$/i,ARCHIVE=/\.(zip|rar|7z|iso|dmg)$/i;
const SLD=["co","com","org","net","gov","ac","edu"];
const LEET={"0":"o","1":"l","3":"e","4":"a","5":"s","7":"t","$":"s"};
const $=id=>document.getElementById(id);
const bad=m=>({verdict:"invalid",score:0,reasons:[m]});

function reg(host){const p=host.split(".");
  if(p.length>=3&&SLD.includes(p[p.length-2])&&p[p.length-1].length===2)return p.slice(-3).join(".");
  return p.slice(-2).join(".")}
const isIP=h=>/^\d{1,3}(\.\d{1,3}){3}$/.test(h)||h.includes(":");
const dec=s=>{try{return decodeURIComponent(s)}catch(e){return s}};
const onList=(h,l)=>l.some(d=>h===d||h.endsWith("."+d));
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length]}
function brandHit(host,r){
  const norm=host.replace(/rn/g,"m").replace(/vv/g,"w").replace(/[013457$]/g,c=>LEET[c]);
  const toks=norm.split(/[.\-_]/).filter(Boolean);
  for(const b of BRANDS){
    if(officialFor(b).includes(r))continue;
    for(const t of toks){
      if(t===b||(b.length>=6&&t.includes(b)))return[b,"uses the name of"];
      if(b.length>=6&&t.length>=6&&Math.abs(t.length-b.length)<=1&&lev(t,b)===1)return[b,"imitates"];
    }
  }
  return null}

function analyze(raw){
  raw=(raw||"").trim();
  if(/\s/.test(raw)){const m=raw.match(/https?:\/\/\S+/i)||raw.match(/\b(?:www\.|[a-z0-9-]+\.[a-z]{2,}\/)\S*/i);raw=m?m[0]:raw.split(/\s+/)[0]}
  raw=raw.replace(/[)\].,;!?'"”’>]+$/,"");
  if(!raw)return bad("Paste a link to check.");
  const sm=raw.match(/^([a-z][a-z0-9+.-]*):/i);
  if(sm&&!/^[a-z0-9.-]+:\d+(\/|$)/i.test(raw)){
    const s=sm[1].toLowerCase();
    if(["javascript","data","vbscript","blob","file"].includes(s))return{score:100,verdict:"danger",domain:"",reasons:["‘"+s+":’ is not a website. It can run hidden code or open files on your device. Do not open it."]};
    if(["mailto","tel","sms"].includes(s))return bad("This is not a web link, so there is nothing to scan.");
    if(["upi","intent","market","tg","whatsapp"].includes(s))return{score:40,verdict:"suspicious",domain:"",reasons:["This link opens another app directly (payments or installs). Only open it if you started the action yourself."]};
  }
  const R=[],add=(p,t)=>R.push([p,t]);
  if(raw.length>2048){raw=raw.slice(0,2048);add(10,"Extremely long link (over 2,000 characters).")}
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(raw))raw="http://"+raw;
  let u;try{u=new URL(raw)}catch(e){return bad("That doesn’t look like a valid link.")}
  const rawHost=raw.replace(/^[a-z][a-z0-9+.-]*:\/\//i,"").split(/[\/?#]/)[0].split("@").pop().replace(/:\d+$/,"").toLowerCase().replace(/\.+$/,"");
  const host=u.hostname.toLowerCase().replace(/^\[|\]$/g,"").replace(/\.+$/,"");
  if(!host||(!host.includes(".")&&!isIP(host)))return bad("That doesn’t look like a valid link.");
  const full=dec(raw).toLowerCase(),tld=host.split(".").pop(),r=reg(host),off=isOfficial(r);
  if(u.protocol!=="https:")add(10,"Not encrypted: the link uses "+u.protocol.replace(":","")+" instead of https.");
  if(isIP(host)){add(30,"Uses a raw IP address instead of a website name.");
    if(!host.includes(":")&&rawHost!==host)add(20,"The IP address is written in a disguised form.")}
  if(u.username||u.password)add(25,"Contains ‘@’, which can hide the real destination.");
  if(u.port&&!["80","443"].includes(u.port))add(10,"Uses an unusual port number (:"+u.port+").");
  if(raw.length>75)add(10,"Unusually long link.");
  if((host.match(/\./g)||[]).length>=4)add(10,"Many nested subdomains, a common disguise trick.");
  if((host.match(/-/g)||[]).length>=2)add(10,"Several hyphens in the domain name.");
  if(host.startsWith("xn--")||host.includes(".xn--"))add(25,"Uses look-alike international characters (punycode).");
  if(RISKY.includes(tld))add(15,"Domain ending ."+tld+" is often used in abuse.");
  if(SHORT.includes(r))add(25,"Shortened link: the real destination is hidden. Treat it as unsafe until you know who sent it.");
  if(onList(host,FREEHOST)&&!off)add(15,"Hosted on a free service that anyone can use. Check who sent you this link.");
  if((raw.match(/%[0-9a-f]{2}/gi)||[]).length>3)add(10,"Heavily encoded characters in the link.");
  const tail=dec(u.pathname+u.search+u.hash);
  if(/https?:\/\/|https?%3a/i.test(tail))add(20,"Contains another link inside it, which may redirect you elsewhere.");
  if(BADFILE.test(u.pathname))add(30,"Downloads a program file that can install malware.");
  else if(ARCHIVE.test(u.pathname))add(15,"Downloads a compressed or disk file.");
  if(!off){const hits=WORDS.filter(k=>full.includes(k));
    if(hits.length)add(Math.min(8*hits.length,24),"Pressure words in the link: "+hits.slice(0,4).join(", ")+".")}
  const bh=brandHit(host,r);
  if(bh)add(50,"Domain "+bh[1]+" ‘"+bh[0]+"’ but belongs to "+r+".");
  else{const pl=tail.toLowerCase(),b=BRANDS.find(b=>b.length>=5&&pl.includes(b)&&!officialFor(b).includes(r));
    if(b&&!off)add(12,"Mentions ‘"+b+"’ in the link, but the website is "+r+".")}
  const score=Math.min(R.reduce((s,x)=>s+x[0],0),100);
  const verdict=score>=50?"danger":score>=20?"suspicious":"safe";
  const reasons=R.sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  return{score,verdict,domain:r,reasons:reasons.length?reasons:["No warning signs found. This is an estimate, not a guarantee."]};
}

const label={safe:"Low risk",suspicious:"Suspicious",danger:"Dangerous",invalid:"Can’t check this"};
function run(){
  const v=$("u").value;
  $("out").style.display="block";
  const d=analyze(v);
  $("v").textContent=label[d.verdict]+(d.verdict==="invalid"?"":" ("+d.score+"/100)");
  $("v").className="verdict "+d.verdict;
  $("d").textContent=d.domain?"Website: "+d.domain:"";
  $("r").innerHTML="";
  d.reasons.forEach(t=>{const li=document.createElement("li");li.textContent=t;$("r").appendChild(li)});
  $("pin").style.left="calc("+d.score+"% - 3px)";
}
$("go").onclick=run;
$("u").onkeydown=e=>{if(e.key==="Enter")run()};
document.querySelectorAll(".samples button").forEach(b=>b.onclick=()=>{$("u").value=b.dataset.u;run()});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const q=new URLSearchParams(location.search);
const shared=q.get("url")||(q.get("text")||"").match(/https?:\/\/\S+/)?.[0]||q.get("text");
if(shared){$("u").value=shared;run()}
</script></body></html>
