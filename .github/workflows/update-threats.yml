name: Update threats database

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch URLhaus feed
        run: python scripts/update_threats.py
        env:
          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}
      - name: Commit changes
        run: |
          git config user.name "linkguard-bot"
          git config user.email "linkguard-bot@users.noreply.github.com"
          git add threats.json
          git diff --cached --quiet || git commit -m "Update threats database"
          git push
